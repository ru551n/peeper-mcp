name: Build pywellen wheels (Windows)

# pywellen (github.com/ekiwi/wellen) ships prebuilt PyPI wheels for Linux
# and macOS only. On Windows, pip/uv fall back to building it from the
# sdist via maturin/cargo at install time, which requires a Rust
# toolchain + the MSVC linker on the installing machine (see README).
#
# This workflow builds and publishes a win_amd64 wheel as a GitHub
# Release purely as an external convenience for downstream users who
# want to `pip install peeper-mcp` on Windows without a Rust toolchain.
# It is NOT consumed by this repo's own pyproject.toml/CI, which always
# build pywellen from the unmodified PyPI sdist like every other
# platform -- our tests should exercise the exact same install path our
# users on Linux/macOS get, not a binary we produced ourselves.
#
# Renovate tracks and bumps the plain `pywellen==X.Y.Z` pin in
# pyproject.toml on its own. This workflow runs on every PR that touches
# pyproject.toml -- which covers every Renovate PR automatically --
# reads whatever version is now pinned, and if we haven't already built
# a Windows wheel for it, builds win_amd64 wheels (py3.12/3.13/3.14)
# from the *unmodified* sdist published on PyPI (no fork or patch of
# wellen's source) and attaches them to a GitHub Release in this repo.
#
# workflow_dispatch is kept for manual/backfill runs (e.g. bootstrapping
# a version that predates this workflow).

on:
  pull_request:
    paths:
      - "pyproject.toml"
  workflow_dispatch:
    inputs:
      version:
        description: "pywellen version to build (defaults to the pin in pyproject.toml)"
        required: false

permissions:
  contents: write

concurrency:
  group: build-pywellen-wheels-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  detect:
    name: Detect target version
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    outputs:
      version: ${{ steps.parse.outputs.version }}
      needs_build: ${{ steps.parse.outputs.needs_build }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
      - name: Parse the pinned pywellen version and check for an existing release
        id: parse
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ inputs.version }}"
          if [ -z "$version" ]; then
            version=$(grep -oP 'pywellen==\K[0-9.]+' pyproject.toml | head -1)
          fi
          if [ -z "$version" ]; then
            echo "Could not find a pywellen==X.Y.Z pin in pyproject.toml" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "pywellen-wheels-v$version" >/dev/null 2>&1; then
            echo "pywellen-wheels-v$version already exists, nothing to build"
            echo "needs_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "needs_build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build wheel (py${{ matrix.python-version }})
    needs: detect
    if: needs.detect.outputs.needs_build == 'true'
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build wheel from the unmodified PyPI sdist
        run: |
          python -m pip install --upgrade pip
          pip wheel --no-deps --no-binary pywellen -w dist "pywellen==${{ needs.detect.outputs.version }}"
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-py${{ matrix.python-version }}
          path: dist/*.whl

  publish:
    name: Publish release
    needs: [detect, build]
    if: needs.detect.outputs.needs_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: pywellen-wheels-v${{ needs.detect.outputs.version }}
          name: "pywellen ${{ needs.detect.outputs.version }} Windows wheels"
          body: |
            Prebuilt Windows (win_amd64) wheels for `pywellen==${{ needs.detect.outputs.version }}`,
            built from the unmodified sdist published on PyPI via maturin/cargo on a
            `windows-latest` GitHub Actions runner. Not affiliated with upstream
            [ekiwi/wellen](https://github.com/ekiwi/wellen); built solely as an
            optional convenience for downstream `peeper-mcp` users on Windows who
            don't have a Rust toolchain installed. Not used by this repo's own
            install/CI, which always build pywellen from source like every other
            platform. Auto-published when the pywellen pin in pyproject.toml
            changed (via Renovate or a manual bump). See the README for details.
          files: dist/*.whl
