name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint & type-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
      - name: Install dependencies
        run: uv sync --frozen
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Type-check
        run: uv run mypy src

  test:
    name: Tests (${{ matrix.os }}, py${{ matrix.python-version }})
    needs: quality
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    # pywellen ships prebuilt wheels for linux x86_64/aarch64 and macOS
    # x86_64/arm64 (cp3.9-cp3.15) but NO WINDOWS WHEELS upstream; on
    # windows-latest this builds from the sdist via maturin/cargo at
    # install time (the runner has Rust + MSVC preinstalled, ~1-2min).
    # See build-pywellen-wheels.yml for the separate, unrelated workflow
    # that publishes a prebuilt Windows wheel as an external convenience
    # for downstream users -- not used by this job.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.14"
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
      - name: Install dependencies
        run: uv sync --frozen
      - name: Run tests
        run: uv run pytest -q

  perf:
    name: Performance gate
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Opt-in perf budgets (cold open < 100 ms, warm values < 20 ms, warm
    # analyze < 50 ms on the ~400k-change bench fixture). Linux only:
    # the budgets are calibrated on CI runners, not local machines.
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
      - name: Install dependencies
        run: uv sync --frozen
      - name: Run perf gate
        run: uv run pytest -q -m perf