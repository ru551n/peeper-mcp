[project]
name = "waver-mcp"
version = "0.1.0"
description = "MCP server for measuring FST waveforms: signal values, period/duty, latency, event search, PNG plots"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    # FastMCP (mcp.server.fastmcp) was removed in mcp 2.x — pin to 1.x.
    "mcp>=2.1,<3",
    "pydantic>=2.12",
    # Rust bindings for the wellen FST/VCD reader: prebuilt wheels for
    # linux (x86_64/aarch64) and macOS (x86_64/arm64), cp3.9-cp3.15.
    # NO WINDOWS WHEELS — CI excludes Windows (see .github/workflows/ci.yml).
    "pywellen==0.25.6",
    # Vectorized analysis over packed (time, value) change lists.
    "numpy>=1.26",
    # Headless PNG rendering for waver_plot.
    "matplotlib>=3.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.scripts]
waver-mcp = "waver_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Perf-gate tests are opt-in: plain `pytest` skips them, CI's perf job
# and `pytest -m perf` (CLI -m overrides this) run them.
addopts = "-m 'not perf'"
markers = [
    "perf: performance-gate tests (opt-in, slow; run with -m perf)",
]

[dependency-groups]
dev = [
    "mypy",
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "UP",
    "B",
    "SIM",
    "C4",
    "RUF",
]

[tool.ruff.lint.isort]
# The pywellen.pyi stub at the repo root would otherwise make ruff treat
# the installed pywellen package as first-party.
known-third-party = ["pywellen"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
warn_unreachable = true